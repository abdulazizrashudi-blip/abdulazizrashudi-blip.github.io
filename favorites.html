<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المفضلة — عقاري</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="https://abdulazizrashudi-blip.github.io/" class="brand">
      <span class="logo-badge">🏠</span>
      عقاري
    </a>
    <nav class="main-nav">
      <a href="https://abdulazizrashudi-blip.github.io/">الرئيسية</a>
      <a href="https://abdulazizrashudi-blip.github.io/map.html">الخريطة</a>
      <a href="https://abdulazizrashudi-blip.github.io/leads.html">اعرض/اطلب عقار</a>
      <a href="https://abdulazizrashudi-blip.github.io/aqari-dashboard/">لوحة التحكم</a>
      <a href="https://abdulazizrashudi-blip.github.io/aqari-owners/">ملاك العقارات</a>
      <a href="https://abdulazizrashudi-blip.github.io/about.html">من نحن</a>
      <a href="https://abdulazizrashudi-blip.github.io/faq.html">الأسئلة الشائعة</a>
      <a href="https://abdulazizrashudi-blip.github.io/favorites.html" class="active">المفضلة</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>عقاراتك المفضلة</h1>
    <p>العقارات اللي حفظتها بالضغط على أيقونة القلب تظهر هنا، وتُحفظ على هذا الجهاز فقط.</p>
  </div>
</section>

<main class="section">
  <div class="section-head">
    <h2>المفضلة</h2>
    <span class="count" id="results-count"></span>
  </div>
  <div class="grid" id="favorites-grid">
    <div class="loading-state">⏳ جاري التحميل...</div>
  </div>
</main>

<footer class="site-footer">
  <div><strong>عقاري</strong> — منصة عقارية</div> <div id="footer-contact" class="footer-contact"></div>
  <div>البيانات محفوظة على قاعدة بيانات حقيقية (Firebase)</div>
</footer>

<script src="app.js"></script>
<script type="module">
  import { getProperties, getOwners, getContactInfo } from './firebase.js';
  getContactInfo().then(c => renderFooterContact(document.getElementById('footer-contact'), c)).catch(() => {});

  const grid = document.getElementById('favorites-grid');
  const countEl = document.getElementById('results-count');

  async function init() {
    try {
      const favIds = getFavorites();
      if (!favIds.length) {
        grid.innerHTML = `<div class="empty-state"><div class="ic">🤍</div><div>ما أضفت أي عقار للمفضلة بعد</div></div>`;
        countEl.textContent = '';
        return;
      }
      const [props, owners] = await Promise.all([getProperties(), getOwners()]);
      const ownerMap = {};
      owners.forEach(o => { ownerMap[o.id] = o; });
      const list = props.filter(p => favIds.includes(p.id));
      countEl.textContent = `${list.length} عقار`;
      renderProperties(grid, list, ownerMap);
    } catch (err) {
      grid.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div><div>تعذّر تحميل المفضلة، حاول تحديث الصفحة</div></div>`;
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
