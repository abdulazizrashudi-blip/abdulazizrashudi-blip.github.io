<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdulaziz Rashudi</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #161a22;
    --text: #f2f3f5;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b2130, var(--bg));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border: 1px solid #262b36;
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    margin: 0 auto 20px;
    color: #0f1115;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
  }
  p.bio {
    color: var(--muted);
    line-height: 1.7;
    margin: 0 0 28px;
    font-size: 15px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .links a {
    display: block;
    padding: 12px 16px;
    border-radius: 12px;
    background: #1d2330;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    border: 1px solid #2a3140;
    transition: border-color .15s ease, transform .15s ease;
  }
  .links a:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #5b6474;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">AR</div>
    <h1>Abdulaziz Rashudi</h1>
    <p class="bio">مرحباً بك في صفحتي التعريفية. هذي الصفحة بدايتها بسيطة وراح تتحدث قريباً بمزيد من التفاصيل.</p>
    <div class="links">
      <a href="mailto:abdulazizrashudi@gmail.com">📧 abdulazizrashudi@gmail.com</a>
    </div>
    <footer>abdulazizrashudi-blip.github.io</footer>
  </div>
</body>
</html>
