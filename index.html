<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقاري — منصة عرض العقارات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="logo-badge">🏠</span>
      عقاري
    </a>
    <nav class="main-nav">
      <a href="index.html" class="active">الرئيسية</a>
      <a href="dashboard.html">لوحة التحكم</a>
      <a href="owners.html">ملاك العقارات</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>لقيت عقارك بسهولة</h1>
    <p>تصفّح شقق، فلل، أراضي ومحلات تجارية للبيع والإيجار في مختلف المدن — عروض مباشرة من الملاك.</p>

    <div class="search-bar">
      <div class="field">
        <label>المدينة</label>
        <select id="f-city"></select>
      </div>
      <div class="field">
        <label>نوع العقار</label>
        <select id="f-type"></select>
      </div>
      <div class="field">
        <label>الحالة</label>
        <select id="f-status">
          <option value="">الكل</option>
          <option value="sale">للبيع</option>
          <option value="rent">للإيجار</option>
        </select>
      </div>
      <div class="field actions">
        <button class="btn btn-primary btn-block" id="f-apply">بحث</button>
      </div>
    </div>
  </div>
</section>

<main class="section">
  <div class="section-head">
    <h2>العقارات المتاحة</h2>
    <span class="count" id="results-count"></span>
  </div>
  <div class="grid" id="properties-grid"></div>
</main>

<footer class="site-footer">
  <div><strong>عقاري</strong> — منصة تجريبية لعرض العقارات</div>
  <div>هذا موقع عرض (Demo) والبيانات تُحفظ محليًا في متصفحك فقط</div>
</footer>

<script src="app.js"></script>
<script>
  const cityFilter = document.getElementById('f-city');
  const typeFilter = document.getElementById('f-type');
  const statusFilter = document.getElementById('f-status');
  const grid = document.getElementById('properties-grid');
  const resultsCount = document.getElementById('results-count');

  fillOptions(cityFilter, CITIES, 'كل المدن');
  fillOptions(typeFilter, PROPERTY_TYPES, 'كل الأنواع');

  function applyFilters() {
    const city = cityFilter.value;
    const type = typeFilter.value;
    const status = statusFilter.value;
    const list = getProperties().filter(p =>
      (!city || p.city === city) &&
      (!type || p.type === type) &&
      (!status || p.status === status)
    );
    renderProperties(grid, list);
    resultsCount.textContent = `${list.length} عقار`;
  }

  document.getElementById('f-apply').addEventListener('click', applyFilters);
  [cityFilter, typeFilter, statusFilter].forEach(el => el.addEventListener('change', applyFilters));

  applyFilters();
</script>
</body>
</html>
